<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Cadence Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --bar:rgba(24,24,26,.84); --sent:#0A84FF; --recv:#262629;
  --sub:#8E8E93; --line:rgba(84,84,88,.55); --field:#1C1C1E; --blue:#0A84FF;
  color-scheme:dark;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

.stage{height:100%;display:grid}
.phone{height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}

/* header */
.top{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);z-index:5;flex:none}
.statusbar,.island,.home{display:none}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:8px 12px 7px}
.back{justify-self:start;display:flex;align-items:center;height:32px;margin-left:-4px;color:var(--blue)}
.badge{background:var(--blue);color:#fff;font-size:13px;font-weight:600;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 7px;margin-left:-1px}
.contact{display:flex;flex-direction:column;align-items:center;gap:4px}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#9A9FB0,#636879)}
.name{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:500;letter-spacing:.01em}
.name svg{color:#636366}
.video{justify-self:end;height:32px;display:flex;align-items:center;color:var(--blue)}

/* thread */
.thread{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 14px 10px;display:flex;flex-direction:column;scrollbar-width:none}
.thread::-webkit-scrollbar{display:none}
.thread-inner{margin-top:auto;display:flex;flex-direction:column;padding-top:14px}
.stamp{text-align:center;font-size:11px;line-height:14px;color:var(--sub);margin:4px 0 6px}
.stamp b{font-weight:600}
.row{display:flex;flex-direction:column;margin-top:10px}
.row.sent{align-items:flex-end}.row.recv{align-items:flex-start}
.bubble{position:relative;max-width:75%;padding:7px 13px 8px;border-radius:18px;font-size:17px;line-height:22px;letter-spacing:-.022em;overflow-wrap:break-word;animation:pop .4s cubic-bezier(.2,1.1,.3,1) both}
.sent .bubble{background:var(--sent);transform-origin:bottom right}
.recv .bubble{background:var(--recv);transform-origin:bottom left}
.sent .bubble::before,.sent .bubble::after,.recv .bubble::before,.recv .bubble::after{content:"";position:absolute;bottom:0;height:18px}
.sent .bubble::before{right:-7px;width:20px;background:var(--sent);border-bottom-left-radius:16px 14px}
.sent .bubble::after{right:-26px;width:26px;background:var(--bg);border-bottom-left-radius:10px}
.recv .bubble::before{left:-7px;width:20px;background:var(--recv);border-bottom-right-radius:16px 14px}
.recv .bubble::after{left:-26px;width:26px;background:var(--bg);border-bottom-right-radius:10px}
.status{font-size:11px;line-height:14px;color:var(--sub);margin:3px 2px 0 0;animation:fade .3s both}
.status b{font-weight:600}

/* typing indicator */
.typing{display:flex;align-items:center;gap:5px;padding:14px 16px;transform-origin:bottom left;background:var(--recv);border-radius:18px;position:relative;animation:pop .4s cubic-bezier(.2,1.1,.3,1) both}
.typing::before,.typing::after{content:"";position:absolute;border-radius:50%;background:var(--recv)}
.typing::before{left:-3px;bottom:-2px;width:13px;height:13px}
.typing::after{left:-9px;bottom:-8px;width:7px;height:7px}
.typing i{width:9px;height:9px;border-radius:50%;background:var(--sub);animation:pulse 1.3s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
.typing.leaving{animation:out .16s ease-in forwards}

/* composer */
.compose{flex:none;padding:8px 12px 6px;background:var(--bg);z-index:5}
.compose-row{display:flex;align-items:center;gap:9px}
.plus{width:34px;height:34px;border-radius:50%;background:#2C2C2E;color:var(--sub);display:grid;place-items:center;flex:none}
.field{flex:1;min-height:36px;display:flex;align-items:center;border:1px solid var(--line);border-radius:19px;padding:0 4px 0 14px}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:17px;letter-spacing:-.022em;caret-color:var(--blue);height:34px}
.field input::placeholder{color:var(--sub)}
.mic,.send{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.mic{color:var(--sub)}
.send{background:var(--blue);display:none}
.has-text .send{display:grid}.has-text .mic{display:none}

@keyframes pop{from{opacity:0;transform:scale(.5) translateY(8px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:scale(.7)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,60%,100%{transform:scale(.72);opacity:.4}30%{transform:scale(1);opacity:1}}
@keyframes dim{0%,60%,100%{opacity:.4}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .bubble,.typing{animation:fade .2s both}
  .typing i{animation-name:dim}
}

/* desktop: iPhone frame */
@media (min-width:520px) and (min-height:560px){
  html,body{background:#0B0B0D}
  .stage{place-items:center}
  .phone{height:min(844px,calc(100dvh - 40px));aspect-ratio:390/844;border-radius:56px;box-shadow:0 0 0 11px #1B1B1D,0 0 0 12.5px #3A3A3E,0 50px 100px rgba(0,0,0,.65)}
  .statusbar{display:flex;justify-content:space-between;align-items:center;height:54px;padding:6px 30px 0 40px;font-size:17px;font-weight:600;letter-spacing:-.02em}
  .statusbar .icons{display:flex;align-items:center;gap:6px}
  .island{display:block;position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px;z-index:20}
  .home{display:block;width:134px;height:5px;border-radius:3px;background:#fff;margin:8px auto 8px}
  .compose{padding-bottom:0}
}
</style>
</head>
<body>
<div class="stage">
<main class="phone">
  <div class="island" aria-hidden="true"></div>
  <header class="top">
    <div class="statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><path d="M1.5 4.2A10 10 0 0 1 15.5 4.2"/><path d="M3.8 6.6A6.7 6.7 0 0 1 13.2 6.6"/><path d="M6 8.9A3.5 3.5 0 0 1 11 8.9"/><circle cx="8.5" cy="10.8" r="1" fill="#fff" stroke="none"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="#fff" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="#fff" opacity=".45"/></svg>
      </span>
    </div>
    <div class="nav">
      <button class="back" aria-label="Back to Messages, 2 unread">
        <svg width="14" height="22" viewBox="0 0 14 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2L3 11l8 9"/></svg>
        <span class="badge">2</span>
      </button>
      <div class="contact">
        <div class="avatar" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15h6l3-8 5 15 3-7h7"/></svg>
        </div>
        <div class="name">Cadence <svg width="6" height="10" viewBox="0 0 6 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4-4 4"/></svg></div>
      </div>
      <button class="video" aria-label="FaceTime video">
        <svg width="30" height="20" viewBox="0 0 30 20" fill="currentColor"><rect x="0" y="1" width="21" height="18" rx="5"/><path d="M23 8.2l5.2-3.6c.9-.6 1.8-.2 1.8.9v9c0 1.1-.9 1.5-1.8.9L23 11.8z"/></svg>
      </button>
    </div>
  </header>

  <section class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation with Cadence">
    <div class="thread-inner" id="inner">
      <div class="stamp">iMessage<br><b>Today</b> 7:42 PM</div>
    </div>
  </section>

  <footer class="compose" id="compose">
    <div class="compose-row">
      <button class="plus" aria-label="Add attachment"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 1.5v13M1.5 8h13"/></svg></button>
      <div class="field">
        <input id="box" type="text" placeholder="iMessage" enterkeyhint="send" autocomplete="off" aria-label="iMessage">
        <button class="mic" aria-label="Dictate"><svg width="14" height="20" viewBox="0 0 14 20" fill="currentColor"><rect x="3.5" y="0" width="7" height="12" rx="3.5"/><path d="M1 9v1a6 6 0 0 0 12 0V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M7 16.5V20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <button class="send" id="send" aria-label="Send"><svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15V2M1.5 7.5L7 2l5.5 5.5"/></svg></button>
      </div>
    </div>
    <div class="home" aria-hidden="true"></div>
  </footer>
</main>
</div>

<script>
(function () {
  var MESSAGES_URL = "messages.json";   // written by main.py
  var POLL_MS = 2000;

  var thread = document.getElementById("thread");
  var inner = document.getElementById("inner");
  var box = document.getElementById("box");
  var compose = document.getElementById("compose");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var shown = 0;        // how many messages from messages.json are on screen
  var cadenceRows = []; // rows created from messages.json (so a reset can remove them)
  var polling = false;  // stops slow requests from overlapping

  function toBottom() {
    requestAnimationFrame(function () {
      thread.scrollTo({ top: thread.scrollHeight, behavior: reduce ? "auto" : "smooth" });
    });
  }

  function addMessage(text, who) {
    var row = document.createElement("div");
    row.className = "row " + who;
    var b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;             // plain text, so model output can't inject HTML
    row.appendChild(b);
    inner.appendChild(row);
    toBottom();
    return row;
  }

  // Every 2 seconds: fetch messages.json and show anything new as a gray left bubble.
  async function poll() {
    if (polling) return;
    polling = true;
    try {
      var res = await fetch(MESSAGES_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return;                       // file doesn't exist yet
      var messages = await res.json();
      if (!Array.isArray(messages)) return;

      if (messages.length < shown) {             // messages.json was reset
        cadenceRows.forEach(function (r) { r.remove(); });
        cadenceRows = [];
        shown = 0;
      }
      messages.slice(shown).forEach(function (m) {
        if (m && typeof m.text === "string" && m.text.trim()) {
          cadenceRows.push(addMessage(m.text, "recv"));
        }
      });
      shown = messages.length;
    } catch (err) {
      // Missing or half-written file: try again on the next tick.
    } finally {
      polling = false;
    }
  }

  // The composer still works: your message appears as a blue right bubble.
  // (The backend doesn't read these yet, so there is no reply.)
  function submit() {
    var v = box.value.trim();
    if (!v) return;
    box.value = "";
    compose.classList.remove("has-text");
    addMessage(v, "sent");
  }

  box.addEventListener("input", function () {
    compose.classList.toggle("has-text", box.value.trim().length > 0);
  });
  box.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  document.getElementById("send").addEventListener("click", submit);

  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
